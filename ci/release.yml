name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: macos
      - run: ./script/package_beta.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --prerelease \
            --title "Trackpad Canvas $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            dist/TrackpadCanvas-0.1.0-beta.2.dmg \
            dist/TrackpadCanvas-0.1.0-beta.2.dmg.sha256
